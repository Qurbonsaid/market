<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Bag Main Gradient (Vibrant Coral/Orange) -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>

    <!-- Bag Front Pocket Gradient -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>

    <!-- Chart Line & Spark Accent Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowApp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="shadowBag" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="glowChart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4ADE80" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#bgGrad)" filter="url(#shadowApp)"/>

  <!-- Subtle Inner Border/Highlight on App Container -->
  <rect x="33" y="33" width="446" height="446" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Main Shopping Bag Graphics -->
  <g filter="url(#shadowBag)">
    <!-- Bag Handles -->
    <path d="M192 170 V130 C192 94.65 220.65 66 256 66 C291.35 66 320 94.65 320 130 V170" 
          fill="none" 
          stroke="#E2E8F0" 
          stroke-width="18" 
          stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M136 160 H376 L396 400 C398 420 382 436 362 436 H150 C130 436 114 420 116 400 L136 160 Z" 
          fill="url(#bagGrad)"/>

    <!-- Bag Inner Fold / Depth Layer -->
    <path d="M136 160 L150 436 H362 L376 160 H136 Z" 
          fill="#FFFFFF" 
          fill-opacity="0.06"/>

    <!-- Front Pocket / Layer -->
    <path d="M140 250 L150 400 C151.5 412 161 420 173 420 H339 C351 420 360.5 412 362 400 L372 250 Z" 
          fill="url(#pocketGrad)"/>
  </g>

  <!-- Market / Analytics Overlay Elements -->
  <!-- Trending Up Chart Line -->
  <path d="M170 330 L225 285 L270 310 L345 220" 
        fill="none" 
        stroke="url(#chartGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowChart)"/>

  <!-- Arrow Head for Chart -->
  <path d="M305 220 H345 V260" 
        fill="none" 
        stroke="url(#chartGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowChart)"/>

  <!-- Floating Coin/Growth Badge (Top Right of Bag) -->
  <g filter="url(#shadowBag)">
    <circle cx="340" cy="160" r="34" fill="url(#coinGrad)"/>
    <circle cx="340" cy="160" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
    <!-- Currency / Percentage Symbol -->
    <path d="M332 170 L348 150 M333 151 A2 2 0 1 1 333 150 M347 170 A2 2 0 1 1 347 169" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>

  <!-- Sparkle / Accent -->
  <path d="M165 200 L170 185 L185 180 L170 175 L165 160 L160 175 L145 180 L160 185 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
